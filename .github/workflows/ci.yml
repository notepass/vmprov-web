name: CI

on:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Run unit tests
        run: go test ./... -short

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Start databases
        run: docker compose up -d --wait
      - name: Run integration tests
        run: go test ./... -count=1
      - name: Stop databases
        if: always()
        run: docker compose down

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [unit, integration]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o bin/server ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-${{ matrix.goarch }}
          path: bin/server
